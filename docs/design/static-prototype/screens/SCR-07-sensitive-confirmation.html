<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCR-07 Review Modal</title><link rel="stylesheet" href="../styles/prototype.css"></head><body><main class="canvas single-canvas"><section class="screen"><div class="screen-h"><span class="screen-id">SCR-07</span><h3 class="screen-name">Full Discovery Review Modal</h3><span class="screen-route">modal · over /scan</span></div><p class="screen-purpose">Review modal before Full Discovery begins.</p><div class="frame-row"><div class="modal-scrim"><div class="modal"><div class="card-pad" style="border-bottom:1px solid var(--border)"><h2 class="h1">Review Full Discovery</h2><p class="body muted" style="margin-top:6px">Selected options will be used for the next Local Snapshot.</p></div><div class="card-pad" style="display:flex;flex-direction:column;gap:14px"><div class="banner banner--warn"><span class="bi">!</span><div>Review the selected options before continuing.</div></div><div class="li" style="border:1px solid var(--border);border-radius:var(--r-md)"><span class="checkbox checked">✓</span><div class="grow"><h3 class="h3">I reviewed the selected options.</h3><p class="small muted">The scan remains read-only.</p></div></div><div class="between"><button class="btn">Cancel</button><button class="btn btn--primary">Start scan</button></div></div></div></div></div></section></main></body></html>
